upstream api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Opsi B: frontend di root domain, API di subdomain
# Ganti binaisi.xyz / api.binaisi.xyz jika domain berbeda.
#
# TLS: setelah HTTP jalan, jalankan:
#   sudo certbot --nginx -d binaisi.xyz -d www.binaisi.xyz -d api.binaisi.xyz
# Certbot akan menambah listen 443 + sertifikat otomatis.

# --- API: api.binaisi.xyz ---
server {
    listen 80;
    server_name api.binaisi.xyz;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# --- www → apex (ALLOWED_ORIGIN hanya https://binaisi.xyz) ---
server {
    listen 80;
    server_name www.binaisi.xyz;
    return 301 http://binaisi.xyz$request_uri;
}

# --- SPA: binaisi.xyz ---
server {
    listen 80;
    server_name binaisi.xyz;

    client_max_body_size 12m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Aktifkan HSTS hanya setelah HTTPS aktif:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://api.binaisi.xyz; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /opt/aisi/apps/web-vite/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
