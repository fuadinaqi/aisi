# Postgres produksi — hanya listen di localhost
# Usage: docker compose -f deploy/docker-compose.db.yml --env-file deploy/env/db.env up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - env/db.env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - aisi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aisi_postgres_data:
