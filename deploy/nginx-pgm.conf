upstream pgm_api {
    server 127.0.0.1:4001;
    keepalive 32;
}

# SPA: pgm.binaisi.xyz
# API: api-pgm.binaisi.xyz
#
# Pasang sekali di server (tidak dijalankan otomatis oleh GitHub Actions):
#   sudo cp deploy/nginx-pgm.conf /etc/nginx/sites-available/pgm
#   sudo ln -sf /etc/nginx/sites-available/pgm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pgm.binaisi.xyz -d api-pgm.binaisi.xyz
# Jangan membuka port 4001 di firewall.

server {
    listen 80;
    server_name api-pgm.binaisi.xyz;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        proxy_pass http://pgm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://pgm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://pgm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name pgm.binaisi.xyz;

    client_max_body_size 12m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://api-pgm.binaisi.xyz; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /opt/aisi/apps/web-pgm/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
