name: CI/CD (Vite + Go)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm diambil dari package.json#packageManager (jangan set "version" di sini)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api-go/go.sum

      - run: pnpm install

      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Build shared
        run: pnpm --filter @dakwah/shared build

      - name: Build Vite SPA
        run: pnpm --filter @dakwah/web-vite build
        env:
          # CI compile-only; nilai produksi di-set di apps/web-vite/.env di VPS
          VITE_API_URL: https://api.binaisi.xyz/api/v1

      - name: Build Go API
        working-directory: apps/api-go
        run: |
          mkdir -p bin
          go build -o bin/aisi-api ./cmd/server

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/aisi
            # Pastikan .git writable (clone sebagai root sering sisakan file milik root)
            if ! touch .git/objects/.ci_write_test 2>/dev/null; then
              echo "ERROR: $(whoami) tidak bisa menulis .git/objects"
              echo "Di VPS (sebagai root) jalankan:"
              echo "  chown -R deploy:deploy /opt/aisi"
              ls -la .git .git/objects | head -20 || true
              exit 1
            fi
            rm -f .git/objects/.ci_write_test
            git fetch origin main
            git reset --hard origin/main
            set -a
            # shellcheck disable=SC1091
            source apps/api-go/.env
            set +a
            bash deploy/deploy.sh
            curl -sf http://127.0.0.1:4000/health
